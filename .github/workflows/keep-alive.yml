name: Keep Supabase Active

on:
  schedule:
    # Runs at 00:00 UTC every 3 days to prevent 7-day dormancy pause on free-tier Supabase
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping QuestionBank Health Endpoint
        run: |
          # Replace with your deployed Vercel/production URL once deployed, or set SITE_URL secret
          TARGET_URL="${{ secrets.PRODUCTION_URL || 'https://question-bank-sepia.vercel.app' }}/api/health"
          echo "Pinging $TARGET_URL to keep database active..."
          curl -s -f "$TARGET_URL" || echo "Ping request executed."
